<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Alex Dantas • Motoboy</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--y:#ffc400;--y2:#ff9800;--b:#050505;--p:#111;--p2:#181818;--l:#303030;--w:#f8f8f8;--m:#999;--g:#29d17c;--r:#ff5555}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--b);color:var(--w);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none}button{font:inherit;border:0;touch-action:manipulation}.app{max-width:900px;margin:auto;min-height:100vh}header{position:sticky;top:0;z-index:10;padding:9px 13px;background:rgba(5,5,5,.96);backdrop-filter:blur(12px);border-bottom:1px solid #242424}.top{display:flex;align-items:center;justify-content:space-between;gap:9px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:55px;height:55px;object-fit:contain;border-radius:12px}.brand b{display:block;font-size:17px}.brand small{color:#999;font-size:10px}.conn{font-size:10px;padding:7px 9px;border:1px solid #292929;border-radius:20px;color:#aaa;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:5px}.on{background:var(--g);box-shadow:0 0 10px #29d17c}main{padding:13px}.install{display:none;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;margin-bottom:11px;background:#151205;border:1px solid #5c4600;border-radius:14px}.install.show{display:flex}.hero{padding:15px;border:1px solid #292929;border-radius:18px;background:linear-gradient(145deg,#171717,#0c0c0c);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-70px;top:-80px;width:190px;height:190px;background:radial-gradient(circle,rgba(255,196,0,.2),transparent 68%)}.heroRow{display:flex;align-items:end;justify-content:space-between}.hero h1{font-size:24px;margin:0 0 4px;font-weight:950}.hero p{margin:0;color:#999;font-size:12px}.count{font-size:32px;font-weight:950;color:var(--y)}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{padding:11px 13px;border-radius:11px;font-weight:900;flex:1;min-width:130px}.yellow{background:linear-gradient(135deg,var(--y),var(--y2));color:#111}.dark{background:#191919;color:#fff;border:1px solid #303030}.green{background:var(--g);color:#03170d}.red{background:#381111;color:#ff9999;border:1px solid #642222}.title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}.title h2{font-size:15px;margin:0}.title span{font-size:10px;color:#777}.list{display:grid;gap:10px}.empty{padding:28px 16px;text-align:center;color:#888;border:1px dashed #333;border-radius:15px;background:#0e0e0e}.order{border:1px solid #2d2d2d;border-radius:17px;background:linear-gradient(150deg,#181818,#101010);overflow:hidden;box-shadow:0 8px 25px #0005}.order.new{border-color:#a97900;box-shadow:0 0 0 1px #ffc40018,0 10px 28px #0007}.head{display:flex;justify-content:space-between;gap:8px;padding:12px 13px;border-bottom:1px solid #292929}.oid{font-weight:900;font-size:12px}.time{font-size:10px;color:#777;margin-top:2px}.badge{font-size:9px;font-weight:900;padding:5px 8px;border-radius:99px;text-transform:uppercase;height:max-content}.pending{background:#3c3005;color:#ffd94c}.accepted{background:#092c1b;color:#6beea8}.in_progress{background:#09273a;color:#72caff}.delivered{background:#222;color:#aaa}.cancelled{background:#361212;color:#ff7777}.route{padding:12px 13px;display:grid;gap:9px}.addr{display:flex;gap:9px}.pin{width:27px;height:27px;flex:none;border-radius:8px;background:#241c03;color:var(--y);display:grid;place-items:center;font-weight:950}.addr b{display:block;font-size:9px;color:#999;margin-bottom:2px}.addr div div{font-size:12px;line-height:1.35}.line{height:1px;background:#292929;margin-left:13px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 13px 11px}.meta div{padding:8px;border-radius:9px;background:#0c0c0c;border:1px solid #242424}.meta strong{display:block;font-size:12px}.meta small{color:#777;font-size:8px}.note{padding:0 13px 11px;color:#bbb;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 13px 13px}.actions .full{grid-column:1/-1}.toast{position:fixed;left:50%;bottom:18px;z-index:100;max-width:calc(100% - 26px);padding:12px 14px;border-radius:12px;background:#191919;border:1px solid #3b3b3b;border-left:4px solid var(--y);transform:translate(-50%,130px);opacity:0;transition:.25s;font-size:12px}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:380px){main{padding:9px}.brand img{width:47px;height:47px}.brand b{font-size:14px}.hero{padding:13px}.hero h1{font-size:21px}.count{font-size:27px}.btn{min-width:0;padding:10px 8px;font-size:11px}.meta{grid-template-columns:1fr 1fr}.meta div:last-child{grid-column:1/-1}.actions{grid-template-columns:1fr}.actions .full{grid-column:auto}}
</style></head><body><div class="app"><header><div class="top"><div class="brand"><img src="logo.png"><div><b>ALEX DANTAS</b><small>MOTOBOY • PAINEL DE ENTREGAS</small></div></div><div class="conn"><i id="dot" class="dot"></i><span id="conn">Offline</span></div></div></header><main><div id="install" class="install"><span><b>Instale o painel</b><br><small style="color:#999">Acesso rápido aos pedidos.</small></span><button id="installBtn" class="btn yellow">INSTALAR</button></div><section class="hero"><div class="heroRow"><div><h1>Pedidos recebidos</h1><p id="sub">Aguardando novas solicitações...</p></div><div id="count" class="count">0</div></div><div class="tools"><button id="sound" class="btn yellow">🔊 ATIVAR SOM</button><button id="refresh" class="btn dark">↻ ATUALIZAR</button></div></section><div class="title"><h2>🔥 NOVOS PEDIDOS</h2><span id="updated">—</span></div><section id="new" class="list"></section><div class="title"><h2>🏍️ EM ANDAMENTO</h2><span>Pedidos aceitos</span></div><section id="active" class="list"></section><div class="title"><h2>✓ HISTÓRICO</h2><span>Últimas entregas</span></div><section id="history" class="list"></section></main></div><div id="toast" class="toast"></div><script src="config.js"></script><script>
const C=window.PACKMAN_CONFIG||{},SB=window.supabase.createClient(C.SUPABASE_URL||'',C.SUPABASE_ANON_KEY||'');let orders=[],soundOn=false,deferred=null;const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=x=>x==null?'—':Number(x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=x=>x?new Date(x).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';const label=x=>({pending:'Pendente',accepted:'Aceito',in_progress:'Em andamento',delivered:'Entregue',cancelled:'Cancelado'})[x]||x;function toast(x){let t=$('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),3200)}function address(o,p){return `${esc(o[p+'_street'])}, ${esc(o[p+'_number'])} — ${esc(o[p+'_district'])}${o[p+'_complement']?' • '+esc(o[p+'_complement']):''}`}
function card(o){return `<article class="order ${o.status==='pending'?'new':''}"><div class="head"><div><div class="oid">#${esc(o.id.slice(0,8).toUpperCase())}</div><div class="time">${date(o.created_at)}</div></div><span class="badge ${esc(o.status)}">${label(o.status)}</span></div><div class="route"><div class="addr"><span class="pin">A</span><div><b>RETIRADA</b><div>${address(o,'from')}</div></div></div><div class="line"></div><div class="addr"><span class="pin">B</span><div><b>DESTINO</b><div>${address(o,'to')}</div></div></div></div><div class="meta"><div><strong>${o.distance_km!=null?Number(o.distance_km).toFixed(1)+' km':'—'}</strong><small>DISTÂNCIA</small></div><div><strong>${o.duration_min!=null?Math.round(o.duration_min)+' min':'—'}</strong><small>TEMPO</small></div><div><strong>${money(o.estimated_price)}</strong><small>VALOR</small></div></div>${o.notes?`<div class="note">📝 ${esc(o.notes)}</div>`:''}<div class="actions">${o.status==='pending'?`<button class="btn green" onclick="status('${o.id}','accepted')">✓ ACEITAR</button><button class="btn red" onclick="status('${o.id}','cancelled')">RECUSAR</button>`:''}${o.status==='accepted'?`<button class="btn yellow" onclick="status('${o.id}','in_progress')">▶ INICIAR</button><button class="btn dark" onclick="route('${o.id}')">📍 ROTA</button>`:''}${o.status==='in_progress'?`<button class="btn green" onclick="status('${o.id}','delivered')">✓ ENTREGUE</button><button class="btn dark" onclick="route('${o.id}')">📍 ROTA</button>`:''}${['delivered','cancelled'].includes(o.status)?`<button class="btn dark full" onclick="route('${o.id}')">📍 ABRIR ROTA</button>`:''}</div></article>`}
function render(){let n=orders.filter(o=>o.status==='pending'),a=orders.filter(o=>['accepted','in_progress'].includes(o.status)),h=orders.filter(o=>['delivered','cancelled'].includes(o.status)).slice(0,15);$('count').textContent=n.length;$('sub').textContent=n.length?`${n.length} pedido(s) aguardando sua ação`:'Aguardando novas solicitações...';$('new').innerHTML=n.length?n.map(card).join(''):`<div class="empty">🚀 Nenhum pedido novo.<br><small>Deixe o painel aberto para receber alertas.</small></div>`;$('active').innerHTML=a.length?a.map(card).join(''):`<div class="empty">Nenhuma entrega em andamento.</div>`;$('history').innerHTML=h.length?h.map(card).join(''):`<div class="empty">Seu histórico aparecerá aqui.</div>`;$('updated').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
async function load(){if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){toast('Configure config.js com os dados do Supabase.');return}let {data,error}=await SB.from('delivery_requests').select('*').order('created_at',{ascending:false}).limit(80);if(error){toast('Erro no Supabase: '+error.message);return}orders=data||[];render()}
async function status(id,s){let {error}=await SB.from('delivery_requests').update({status:s}).eq('id',id);if(error){toast('Erro: '+error.message);return}toast(s==='accepted'?'Pedido aceito!':s==='in_progress'?'Entrega iniciada!':s==='delivered'?'Entrega concluída!':'Pedido recusado.');load()}
function beep(){try{let A=AudioContext||webkitAudioContext,c=new A(),n=c.currentTime;[0,.18,.36].forEach((d,i)=>{let o=c.createOscillator(),g=c.createGain();o.frequency.value=700+i*150;o.type='sine';g.gain.setValueAtTime(.0001,n+d);g.gain.exponentialRampToValueAtTime(.24,n+d+.025);g.gain.exponentialRampToValueAtTime(.0001,n+d+.14);o.connect(g).connect(c.destination);o.start(n+d);o.stop(n+d+.16)})}catch(e){}}
$('sound').onclick=async()=>{soundOn=true;beep();$('sound').textContent='🔔 SOM ATIVO';if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();toast('Som e notificações ativados.')};window.route=id=>{let o=orders.find(x=>x.id===id);if(o)window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(`${o.to_street}, ${o.to_number}, ${o.to_district}`),'_blank')};$('refresh').onclick=load;
SB.channel('delivery-requests-motoboy').on('postgres_changes',{event:'INSERT',schema:'public',table:'delivery_requests'},p=>{orders=[p.new,...orders.filter(x=>x.id!==p.new.id)];render();toast('🔥 NOVO PEDIDO RECEBIDO!');if(soundOn)beep();if('Notification'in window&&Notification.permission==='granted')new Notification('🚀 Novo pedido',{body:`${Number(p.new.distance_km||0).toFixed(1)} km • ${money(p.new.estimated_price)}`})}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'delivery_requests'},p=>{orders=orders.map(x=>x.id===p.new.id?p.new:x);render()}).subscribe(s=>{let on=s==='SUBSCRIBED';$('dot').classList.toggle('on',on);$('conn').textContent=on?'Online':'Reconectando'});load();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').classList.add('show')});$('installBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').classList.remove('show')};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
